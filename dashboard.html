<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solana ARB Bot Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            background: #4CAF50;
            border-radius: 20px;
            color: white;
            font-size: 0.9em;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }
        
        .stat-value.positive {
            color: #4CAF50;
        }
        
        .stat-value.negative {
            color: #f44336;
        }
        
        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            position: relative;
            height: 300px;
        }
        
        .trades-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .trades-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        
        .trades-table th {
            background: #f5f5f5;
            padding: 10px;
            text-align: left;
            border-bottom: 2px solid #ddd;
        }
        
        .trades-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        
        .profit {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .loss {
            color: #f44336;
            font-weight: bold;
        }
        
        .filled {
            background: #e8f5e9;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8em;
        }
        
        .partial {
            background: #fff3e0;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8em;
        }
        
        .failed {
            background: #ffebee;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.8em;
        }
        
        .refresh-time {
            text-align: center;
            color: white;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Solana ARB Bot</h1>
            <div class="status">✅ Running</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Current Balance</div>
                <div class="stat-value" id="balance">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">ROI</div>
                <div class="stat-value" id="roi">+0.00%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Trades</div>
                <div class="stat-value" id="trades">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Success Rate</div>
                <div class="stat-value" id="success">0%</div>
            </div>
        </div>
        
        <div class="chart-container">
            <canvas id="roiChart"></canvas>
        </div>
        
        <div class="trades-container">
            <h3 style="margin-bottom: 15px;">Recent Trades</h3>
            <table class="trades-table">
                <thead>
                    <tr>
                        <th>Pair</th>
                        <th>Buy DEX</th>
                        <th>Sell DEX</th>
                        <th>Spread</th>
                        <th>Profit</th>
                        <th>Status</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="tradesBody">
                    <tr><td colspan="7" style="text-align: center; color: #999;">Loading...</td></tr>
                </tbody>
            </table>
        </div>
        
        <div class="refresh-time">
            Last updated: <span id="lastUpdate">--:--:--</span> | Auto-refreshing every 30 seconds
        </div>
    </div>
    
    <script>
        let roiChart = null;
        
        async function loadData() {
            try {
                const response = await fetch('data/state.json');
                const data = await response.json();
                
                // Update stats
                document.getElementById('balance').textContent = `$${data.balance_usd.toFixed(2)}`;
                
                const roi = ((data.balance_usd - data.starting_balance_usd) / data.starting_balance_usd * 100);
                const roiEl = document.getElementById('roi');
                roiEl.textContent = `${roi > 0 ? '+' : ''}${roi.toFixed(2)}%`;
                roiEl.className = 'stat-value ' + (roi > 0 ? 'positive' : 'negative');
                
                document.getElementById('trades').textContent = data.total_trades;
                
                const winTrades = data.total_trades - (data.failed_trades || 0);
                const successRate = data.total_trades > 0 ? (winTrades / data.total_trades * 100) : 0;
                document.getElementById('success').textContent = `${successRate.toFixed(1)}%`;
                
                // Update chart
                updateChart(data.trades);
                
                // Update trades table
                updateTradesTable(data.trades);
                
                // Update timestamp
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        function updateChart(trades) {
            const roiOverTime = [];
            let runningBalance = 1000;
            
            trades.forEach(trade => {
                runningBalance += trade.profit_usd;
                roiOverTime.push(((runningBalance - 1000) / 1000 * 100).toFixed(2));
            });
            
            const ctx = document.getElementById('roiChart').getContext('2d');
            
            if (roiChart) {
                roiChart.destroy();
            }
            
            roiChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array.from({length: roiOverTime.length}, (_, i) => i + 1),
                    datasets: [{
                        label: 'ROI %',
                        data: roiOverTime,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return value.toFixed(2) + '%';
                                }
                            }
                        }
                    }
                }
            });
        }
        
        function updateTradesTable(trades) {
            const tbody = document.getElementById('tradesBody');
            tbody.innerHTML = '';
            
            const recentTrades = trades.slice(-10).reverse();
            
            recentTrades.forEach(trade => {
                const row = document.createElement('tr');
                const profitClass = trade.profit_usd > 0 ? 'profit' : 'loss';
                const statusClass = trade.status === 'filled' ? 'filled' : 
                                   trade.status === 'partial_fill' ? 'partial' : 'failed';
                
                row.innerHTML = `
                    <td>${trade.pair}</td>
                    <td>${trade.buy_dex}</td>
                    <td>${trade.sell_dex}</td>
                    <td>${trade.net_spread_pct.toFixed(3)}%</td>
                    <td class="${profitClass}">$${trade.profit_usd.toFixed(4)}</td>
                    <td><span class="${statusClass}">${trade.status}</span></td>
                    <td>${new Date(trade.timestamp).toLocaleTimeString()}</td>
                `;
                tbody.appendChild(row);
            });
        }
        
        // Load data immediately and every 30 seconds
        loadData();
        setInterval(loadData, 30000);
    </script>
</body>
</html>
