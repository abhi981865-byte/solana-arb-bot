name: Solana ARB Bot Daemon

on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - run: pip install httpx python-dotenv requests
      
      - run: python3 daemon.py || true
      
      - run: git add -A && git commit -m "Bot cycle $(date)" && git push || true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

