name: Bot Monitor & Backup (v2)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check bot health
        run: python -c "import sqlite3, os; db='data/arb_trades.db'; print('✅ Bot running' if os.path.exists(db) else '❌ No database')"
      - name: Create backup
        run: mkdir -p data/backups && cp data/arb_trades.db data/backups/backup_$(date +%Y%m%d_%H%M%S).db
      - name: Push backup
        run: git config --global user.email "bot@example.com" && git config --global user.name "Bot" && git add data/backups/ && git commit -m "Backup" && git push || true
