name: Bot Monitor & Backup (v2)

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Check bot health
        run: echo "✅ Bot Monitor (Real bot runs on phone locally)"
      
      - name: Create backup if exists
        run: |
          mkdir -p data/backups
          if [ -f "data/arb_trades.db" ]; then
            cp data/arb_trades.db data/backups/backup_$(date +%Y%m%d_%H%M%S).db
          fi
      
      - name: Push backup
        run: |
          git config --global user.email "bot@example.com"
          git config --global user.name "Bot"
          git add data/backups/ || true
          git commit -m "Backup" || true
          git push || true
